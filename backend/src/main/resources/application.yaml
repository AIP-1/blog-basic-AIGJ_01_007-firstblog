spring:
  application:
    name: ownlog
  config:
    # 루트의 .env를 읽어요 (실행 위치가 루트든 backend든 동작하게 두 경로)
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ownlog}
    username: ${DB_USERNAME:ownlog}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate      # 스키마는 Flyway가 만들고, JPA는 엔티티와 맞는지 검사만 해요
    open-in-view: false       # DB 연결을 요청 끝까지 붙잡지 않아요
  servlet:
    multipart:
      max-file-size: 5MB      # P-03 이미지 제한
      max-request-size: 6MB

ownlog:
  jwt:
    secret: ${JWT_SECRET}
    access-token-validity: 2h # U-03
  upload:
    dir: ${UPLOAD_DIR:./uploads}
    # 고아 파일 정리 배치 (매일 04:00 KST). grace보다 오래된, 아무도 안 쓰는 파일만 지워요 (docs/image-flow.md 6장)
    cleanup:
      enabled: ${IMAGE_CLEANUP_ENABLED:true}
      grace: 24h
  # 소셜 로그인 (U-09). 키가 비어 있는 서비스는 꺼지고 그 버튼도 보이지 않아요 (문서 저장소 ownlog-docs의 docs/guide/소셜-로그인.md)
  # 환경변수 이름: GOOGLE_CLIENT_ID 같은 짧은 이름을 먼저 읽고, 없으면 예전 이름 OAUTH_GOOGLE_CLIENT_ID를 읽어요
  oauth:
    public-url: ${PUBLIC_URL:}
    clients:
      kakao:
        client-id: ${KAKAO_CLIENT_ID:${OAUTH_KAKAO_CLIENT_ID:}}
        client-secret: ${KAKAO_CLIENT_SECRET:${OAUTH_KAKAO_CLIENT_SECRET:}}
      naver:
        client-id: ${NAVER_CLIENT_ID:${OAUTH_NAVER_CLIENT_ID:}}
        client-secret: ${NAVER_CLIENT_SECRET:${OAUTH_NAVER_CLIENT_SECRET:}}
      google:
        client-id: ${GOOGLE_CLIENT_ID:${OAUTH_GOOGLE_CLIENT_ID:}}
        client-secret: ${GOOGLE_CLIENT_SECRET:${OAUTH_GOOGLE_CLIENT_SECRET:}}
      github:
        client-id: ${GITHUB_CLIENT_ID:${OAUTH_GITHUB_CLIENT_ID:}}
        client-secret: ${GITHUB_CLIENT_SECRET:${OAUTH_GITHUB_CLIENT_SECRET:}}
