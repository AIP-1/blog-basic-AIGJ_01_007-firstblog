# 테스트 전용 설정. .env가 없는 환경(CI 등)에서도 테스트가 돌아가게 해요.
ownlog:
  jwt:
    secret: test-secret-key-for-ownlog-at-least-32-bytes-long
  upload:
    dir: build/test-uploads   # build 아래라서 git에 올라가지 않아요
    cleanup:
      enabled: false   # 정해진 시각에 도는 정리 배치는 끄고, 테스트에서는 run()을 직접 불러요

# N+1 검증용: 실행된 SQL 수를 셀 수 있게 Hibernate 통계를 켜요 (테스트에서만)
spring:
  jpa:
    properties:
      hibernate:
        generate_statistics: true
logging:
  level:
    org.hibernate.engine.internal.StatisticalLoggingSessionEventListener: WARN

# 내 컴퓨터의 .env(application.yaml이 읽어요)에 있는 진짜 소셜 로그인 키가 테스트에 섞이지 않게 비워요.
# 키가 필요한 테스트는 @TestPropertySource로 직접 넣어요 (그쪽이 우선이에요)
KAKAO_CLIENT_ID: ""
OAUTH_KAKAO_CLIENT_ID: ""
KAKAO_CLIENT_SECRET: ""
OAUTH_KAKAO_CLIENT_SECRET: ""
