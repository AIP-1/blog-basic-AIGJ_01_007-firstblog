# 운영을 직전 버전(또는 지정한 이미지 태그)으로 되돌려요.
# 다시 빌드하지 않고, deploy.sh가 서버에 남겨 둔 이미지로 블루-그린 전환만 해요 → 1~2분이면 끝나요.
# 실행: GitHub → Actions → Rollback → Run workflow (태그를 비우면 직전 버전)
name: Rollback

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "되돌릴 이미지 태그(커밋 SHA). 비우면 서버에 기록된 직전 버전"
        required: false
        default: ""

# 배포와 같은 그룹: 배포 중에 롤백이 겹치지 않게 줄을 세워요
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_PORT: "8360"

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: 서버에 남은 이미지로 전환
        uses: appleboy/ssh-action@v1.2.0
        env:
          # 입력값은 스크립트에 직접 끼워 넣지 않고 환경변수로만 넘겨요 (명령 주입 방지)
          ROLLBACK_TAG: ${{ inputs.image_tag }}
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # Secret 이름은 GOOGLE_CLIENT_ID처럼 짧은 이름 우선, 예전 OAUTH_ 이름도 받아요.
          # 깃허브만 예외: GitHub은 GITHUB_로 시작하는 Secret 이름을 허용하지 않아서 OAUTH_GITHUB_CLIENT_ID를 써요
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OAUTH_KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID || secrets.OAUTH_KAKAO_CLIENT_ID }}
          OAUTH_KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET || secrets.OAUTH_KAKAO_CLIENT_SECRET }}
          OAUTH_NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID || secrets.OAUTH_NAVER_CLIENT_ID }}
          OAUTH_NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET || secrets.OAUTH_NAVER_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: ROLLBACK_TAG,APP_PORT,DB_ADDRESS,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,DB_SCHEMA,JWT_SECRET,OAUTH_GITHUB_CLIENT_ID,OAUTH_GITHUB_CLIENT_SECRET,OAUTH_GOOGLE_CLIENT_ID,OAUTH_GOOGLE_CLIENT_SECRET,OAUTH_KAKAO_CLIENT_ID,OAUTH_KAKAO_CLIENT_SECRET,OAUTH_NAVER_CLIENT_ID,OAUTH_NAVER_CLIENT_SECRET
          command_timeout: 10m
          script: |
            set -e
            TAG="${ROLLBACK_TAG:-}"
            if [ -z "$TAG" ]; then
              TAG="$(cut -d: -f2 ~/ownlog-deploy/previous-image 2>/dev/null || true)"
            fi
            if ! [[ "$TAG" =~ ^[0-9a-f]{7,40}$ ]]; then
              echo "❌ 되돌릴 이미지 태그가 없거나 형식이 달라요 (커밋 SHA여야 해요)"
              exit 1
            fi
            if ! docker image inspect "ownlog:$TAG" > /dev/null 2>&1; then
              echo "❌ 서버에 ownlog:$TAG 이미지가 없어요. 남아 있는 이미지:"
              docker images ownlog --format '  {{.Tag}}  ({{.CreatedSince}})'
              exit 1
            fi
            echo "▶ ownlog:$TAG 로 되돌려요"
            IMAGE_TAG="$TAG" SKIP_LOAD=1 bash ~/ownlog-deploy/deploy/deploy.sh
