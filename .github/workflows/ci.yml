# develop·작업 브랜치에 푸시하거나 PR을 열면 테스트만 돌려요 (배포는 main만: deploy.yml)
name: CI

on:
  push:
    branches: [develop, "feature/**", "fix/**", "chore/**", "release/**", "hotfix/**"]
    paths-ignore:      # 문서만 바뀌면 테스트하지 않아요
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: 백엔드 테스트 (Testcontainers로 진짜 PostgreSQL 사용)
        working-directory: backend
        run: ./gradlew test --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트엔드 린트·빌드
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
