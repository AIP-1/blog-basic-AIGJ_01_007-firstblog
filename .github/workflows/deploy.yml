# main에 푸시하면: 테스트 → Docker 이미지 빌드 → 서버로 전송 → deploy/deploy.sh 실행
# 비밀값은 GitHub → Settings → Secrets and variables → Actions의 Repository secrets에서 가져와요
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:      # 문서만 바뀌면 배포하지 않아요
      - "**.md"
      - "docs/**"
      - "scripts/**"
  workflow_dispatch:   # Actions 화면에서 직접 실행할 수도 있어요

env:
  APP_PORT: "8360"   # 수업에서 배정받은 앱 포트 번호 (Nginx proxy_pass와 같은 값)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: 백엔드 테스트 (Testcontainers로 진짜 PostgreSQL 사용)
        working-directory: backend
        run: ./gradlew test --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트엔드 린트·빌드
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: test   # 테스트가 하나라도 실패하면 배포하지 않아요
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker 이미지 빌드
        run: |
          docker build -t ownlog:${{ github.sha }} .
          docker save ownlog:${{ github.sha }} | gzip > ownlog.tar.gz

      - name: 서버로 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "ownlog.tar.gz,deploy/deploy.sh"
          target: "~/ownlog-deploy"

      - name: 서버에서 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_TAG,APP_PORT,DB_ADDRESS,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,DB_SCHEMA,JWT_SECRET
          script: bash ~/ownlog-deploy/deploy/deploy.sh
