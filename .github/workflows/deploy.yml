# main에 푸시하면: 테스트 → Docker 이미지 빌드 → 서버로 전송 → deploy/deploy.sh 실행
# 비밀값은 GitHub → Settings → Secrets and variables → Actions의 Repository secrets에서 가져와요
name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:      # 문서·화면 점검·시연 스크립트만 바뀌면 배포하지 않아요 (운영 이미지에 들어가지 않는 파일)
      - "**.md"
      - "docs/**"
      - "scripts/**"
      - "e2e/**"
  workflow_dispatch:   # Actions 화면에서 직접 실행할 수도 있어요

env:
  APP_PORT: "8360"   # 수업에서 배정받은 앱 포트 번호 (Nginx proxy_pass와 같은 값)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: 백엔드 테스트 (Testcontainers로 진짜 PostgreSQL 사용)
        working-directory: backend
        run: ./gradlew test --no-daemon

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트엔드 린트·빌드
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build

  deploy:
    needs: test   # 테스트가 하나라도 실패하면 배포하지 않아요
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker 이미지 빌드
        run: |
          docker build -t ownlog:${{ github.sha }} .
          docker save ownlog:${{ github.sha }} | gzip > ownlog.tar.gz

      - name: 서버로 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "ownlog.tar.gz,deploy/deploy.sh"
          target: "~/ownlog-deploy"

      - name: 서버에서 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_TAG: ${{ github.sha }}
          DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SCHEMA: ${{ secrets.DB_SCHEMA }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          # 소셜 로그인 (선택): 등록하지 않은 서비스는 값이 비어서 그 로그인 버튼만 숨겨져요 (문서 저장소 ownlog-docs의 docs/guide/소셜-로그인.md)
          OAUTH_GITHUB_CLIENT_ID: ${{ secrets.OAUTH_GITHUB_CLIENT_ID }}
          OAUTH_GITHUB_CLIENT_SECRET: ${{ secrets.OAUTH_GITHUB_CLIENT_SECRET }}
          OAUTH_GOOGLE_CLIENT_ID: ${{ secrets.OAUTH_GOOGLE_CLIENT_ID }}
          OAUTH_GOOGLE_CLIENT_SECRET: ${{ secrets.OAUTH_GOOGLE_CLIENT_SECRET }}
          OAUTH_KAKAO_CLIENT_ID: ${{ secrets.OAUTH_KAKAO_CLIENT_ID }}
          OAUTH_KAKAO_CLIENT_SECRET: ${{ secrets.OAUTH_KAKAO_CLIENT_SECRET }}
          OAUTH_NAVER_CLIENT_ID: ${{ secrets.OAUTH_NAVER_CLIENT_ID }}
          OAUTH_NAVER_CLIENT_SECRET: ${{ secrets.OAUTH_NAVER_CLIENT_SECRET }}
        with:
          host: ${{ secrets.SSH_ADDRESS }}
          username: ${{ secrets.SSH_ID }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          envs: IMAGE_TAG,APP_PORT,DB_ADDRESS,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,DB_SCHEMA,JWT_SECRET,OAUTH_GITHUB_CLIENT_ID,OAUTH_GITHUB_CLIENT_SECRET,OAUTH_GOOGLE_CLIENT_ID,OAUTH_GOOGLE_CLIENT_SECRET,OAUTH_KAKAO_CLIENT_ID,OAUTH_KAKAO_CLIENT_SECRET,OAUTH_NAVER_CLIENT_ID,OAUTH_NAVER_CLIENT_SECRET
          command_timeout: 15m   # 블루-그린은 새 버전 기동 + 예전 버전 정상 종료까지 기다려서 기본 10분보다 넉넉히
          script: bash ~/ownlog-deploy/deploy/deploy.sh
