services:
  postgres:
    image: postgres:17
    container_name: ownlog-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ownlog}
      POSTGRES_USER: ${DB_USERNAME:-ownlog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 파일에 DB_PASSWORD를 설정해 주세요}
      TZ: Asia/Seoul
    ports:
      # 127.0.0.1: 내 컴퓨터에서만 접속돼요. 주소를 안 적으면 0.0.0.0(전체)에 열려서
      # 같은 와이파이의 다른 컴퓨터도 DB에 접속을 시도할 수 있어요 (docs/learning-log.md 2단계)
      - "127.0.0.1:5432:5432"
    volumes:
      - ownlog-pgdata:/var/lib/postgresql/data   # 컨테이너를 지워도 데이터 유지

volumes:
  ownlog-pgdata:
