services:
  postgres:
    image: postgres:17
    container_name: ownlog-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-ownlog}
      POSTGRES_USER: ${DB_USERNAME:-ownlog}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env 파일에 DB_PASSWORD를 설정해 주세요}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - ownlog-pgdata:/var/lib/postgresql/data   # 컨테이너를 지워도 데이터 유지

volumes:
  ownlog-pgdata:
